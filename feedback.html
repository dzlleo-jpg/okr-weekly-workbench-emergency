<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>产品建议 · OKR 周报工作台</title>
<style>
:root{--bg:#f7f6f1;--fg:#202124;--muted:#686d73;--line:#d9d4c8;--panel:#fffefa;--blue:#235e9d;--green:#147755;--red:#a44036;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffdf8 0,var(--bg) 260px);color:var(--fg);font-family:var(--font);letter-spacing:0}.topnav{padding:10px 20px;font-size:12px;color:var(--muted);background:rgba(236,231,220,.5);border-bottom:1px solid var(--line)}.topnav a{color:var(--muted);text-decoration:none}.topnav a:first-child{color:var(--blue);font-weight:700}.topnav span{margin:0 8px;color:#b8b0a2}main{width:min(920px,calc(100% - 40px));margin:0 auto;padding:34px 0 50px}h1{margin:0 0 10px;font-size:clamp(30px,4vw,46px);line-height:1.1}.lead{margin:0 0 24px;color:var(--muted);line-height:1.7}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 48px rgba(34,33,28,.08);padding:22px}form{display:grid;gap:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-size:13px;font-weight:760;color:#4f5359}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:10px 11px;font:inherit;color:var(--fg)}textarea{min-height:110px;resize:vertical;line-height:1.6}button{width:fit-content;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:800;padding:10px 16px;cursor:pointer}.status{min-height:24px;font-size:13px;font-weight:760}.status.ok{color:var(--green)}.status.err{color:var(--red)}.list{display:grid;gap:10px;margin-top:20px}.item{border-top:1px solid var(--line);padding-top:12px}.item b{display:block}.item p{margin:6px 0 0;color:var(--muted);line-height:1.6;white-space:pre-wrap}@media(max-width:760px){main{width:min(100% - 32px,720px);padding-top:24px}.grid{grid-template-columns:1fr}.panel{padding:18px}button{width:100%}}
</style>
</head>
<body>
<nav class="topnav">
  <a href="./tracker.html">← 周报填写</a>
  <span>·</span>
  <a href="./progress.html">项目进展视图</a>
</nav>
<main>
  <h1>让反馈进入优化池</h1>
  <p class="lead">会议备用入口。这里提交的建议会保存到 Firebase，后续再进入产品优化候选池。</p>
  <section class="panel">
    <form id="feedback-form">
      <div class="grid">
        <label>提交人<input name="reporter" autocomplete="name" placeholder="姓名"></label>
        <label>影响区域<select name="area"><option>周报填写</option><option>项目进展</option><option>上传下载</option><option>产品建议</option><option>其他</option></select></label>
      </div>
      <label>标题<input name="title" required placeholder="一句话说明问题或建议"></label>
      <label>详细说明<textarea name="detail" required placeholder="发生了什么、影响谁、希望如何改善"></textarea></label>
      <label>影响<textarea name="impact" placeholder="例如：影响会议填写效率、保存信心、路线图查看"></textarea></label>
      <button type="submit">提交建议</button>
      <div id="status" class="status"></div>
    </form>
    <div id="list" class="list"></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyCzQ81s_xCVQzhGrKKspjqaxIDlujvbmKc",authDomain:"family-sync-app-b3d51.firebaseapp.com",databaseURL:"https://family-sync-app-b3d51-default-rtdb.firebaseio.com",projectId:"family-sync-app-b3d51",storageBucket:"family-sync-app-b3d51.firebasestorage.app",messagingSenderId:"545912389388",appId:"1:545912389388:web:95de71d8248310b8821329"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var form=document.getElementById('feedback-form');
var statusEl=document.getElementById('status');
var listEl=document.getElementById('list');
form.addEventListener('submit',function(e){
  e.preventDefault();
  var data=Object.fromEntries(new FormData(form).entries());
  var item={reporter:data.reporter||'匿名',area:data.area||'其他',title:data.title,detail:data.detail,impact:data.impact||'',priority:'normal',status:'candidate',source:'github-pages-emergency',createdAt:new Date().toISOString()};
  statusEl.className='status';statusEl.textContent='提交中...';
  db.ref('productFeedback').push(item).then(function(){statusEl.className='status ok';statusEl.textContent='已提交，会进入产品优化候选池。';form.reset();loadFeedback()}).catch(function(err){statusEl.className='status err';statusEl.textContent='保存失败：'+err.message});
});
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function loadFeedback(){
  db.ref('productFeedback').limitToLast(8).once('value').then(function(s){
    var items=[];s.forEach(function(child){items.push(child.val())});items.reverse();
    listEl.innerHTML=items.map(function(x){return '<article class="item"><b>'+esc(x.title)+'</b><p>'+esc([x.area,x.reporter,x.createdAt].filter(Boolean).join(' · '))+'</p><p>'+esc(x.detail)+'</p></article>'}).join('');
  }).catch(function(){listEl.innerHTML=''});
}
loadFeedback();
</script>
</body>
</html>
