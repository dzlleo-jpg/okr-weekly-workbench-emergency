<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="robots" content="noindex,nofollow">

<title>2026 团队重点工作</title>
<style>
:root{
  --bg:#f7f6f1;--fg:#202124;--muted:#686d73;--line:#d9d4c8;--panel:#fffefa;--soft:#ece7dc;
  --gray1:#f2eee6;--gray2:#d9d4c8;--gray3:#b8b0a2;--gray4:#686d73;--gray5:#4f5359;
  --blue:#235e9d;--red:#a44036;--green:#147755;--orange:#9a5a12;
  --shadow:0 18px 48px rgba(34,33,28,.08);
  --radius:8px;--radius-sm:6px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:linear-gradient(180deg,#fffdf8 0,var(--bg) 260px);color:var(--fg);letter-spacing:0;-webkit-font-smoothing:antialiased}

.app{width:min(1480px,calc(100% - 40px));margin:0 auto;padding:30px 0 46px}
.topnav{padding:10px 20px;font-size:12px;color:var(--muted);background:rgba(236,231,220,.5);border-bottom:1px solid var(--line)}
.topnav a{color:var(--muted);text-decoration:none;transition:color .18s ease}
.topnav a:first-child{color:var(--blue);font-weight:700}
.topnav a:hover{color:var(--fg)}
.topnav span{margin:0 8px;color:var(--gray3)}

/* header */
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(30px,3.2vw,46px);line-height:1.08;font-weight:820;color:var(--fg)}
.hr{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.hr button{font-size:12px;padding:7px 13px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);cursor:pointer;color:var(--gray5);font-family:var(--font);box-shadow:0 8px 18px rgba(34,33,28,.04);transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease}
.hr button:hover{background:var(--soft);border-color:#c8c0b2;color:var(--fg);transform:translateY(-1px)}
.hr button:active{transform:translateY(0)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--gray3);transition:background .3s;flex-shrink:0}
.sd.saving{background:var(--orange)}.sd.saved{background:var(--green)}.sd.failed{background:var(--red)}
.ss-text{color:var(--muted);font-weight:650}

/* week nav */
.wn{display:flex;align-items:center;gap:8px;margin:18px 0 20px;padding:10px 12px;width:fit-content;max-width:100%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;overflow-x:auto}
.ar{width:32px;height:32px;border:1px solid var(--line);background:var(--soft);border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gray4);font-family:var(--font);padding:0;transition:all .18s ease;flex:0 0 auto}
.ar:hover{background:var(--panel);border-color:#c8c0b2;color:var(--fg);transform:translateY(-1px)}.ar.off{opacity:.35;pointer-events:none}
.wl{padding:0 10px;font-weight:760;min-width:190px;text-align:center;font-size:15px;white-space:nowrap}
.ws{font-size:12px;color:var(--blue);font-weight:760;margin-left:8px;background:rgba(35,94,157,.1);padding:3px 8px;border-radius:999px}
.wn > span{flex:0 0 auto;white-space:nowrap}

/* objective */
.ob{margin-bottom:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.oh{display:flex;align-items:center;gap:12px;padding:15px 16px;margin-bottom:0;background:linear-gradient(90deg,rgba(236,231,220,.82),rgba(255,254,250,.94));border-bottom:1px solid var(--line)}
.oh:hover .og{opacity:.5}.oh:hover .od{opacity:1}
.og{opacity:.28;cursor:grab;font-size:16px;color:var(--gray4);user-select:none;transition:opacity .2s,color .2s;width:20px;text-align:center;flex-shrink:0}
.og:hover{color:var(--gray5)}
.og:active{cursor:grabbing}
.on{display:inline-flex;align-items:center;justify-content:center;min-width:42px;min-height:25px;padding:4px 9px;color:#fff;background:var(--fg);border-radius:var(--radius-sm);font-size:13px;font-weight:760;line-height:1;flex-shrink:0}
.oa{padding:5px 9px;color:var(--green);background:rgba(20,119,85,.1);border-radius:999px;font-size:13px;font-weight:760;white-space:nowrap;margin-left:auto;flex-shrink:0}
.od{opacity:0;transition:all .2s;font-size:18px;color:var(--gray3);cursor:pointer;border:none;background:none;padding:4px 8px;border-radius:var(--radius-sm)}
.od:hover{color:var(--red);background:rgba(255,59,48,.08)}

/* inputs */
.ei{border:none;background:transparent;width:100%;padding:6px 0;outline:none;font-family:var(--font);color:var(--fg);transition:border-color .18s ease,background .18s ease,color .18s ease;border-bottom:1.5px solid transparent;border-radius:0}
.ei:focus{border-bottom-color:var(--blue)}
.ei:hover:not(:focus){border-bottom-color:var(--line)}
.ei.t{font-size:19px;font-weight:780;line-height:1.35}
.ei.kn{font-size:17px;font-weight:650;line-height:1.4}
.ei.ow{font-size:13px;color:var(--gray4);width:auto;max-width:200px}
.ei.ow::placeholder{color:var(--gray3)}.ei.ow:focus{color:var(--fg)}
.ei.st{font-size:12px;color:var(--gray4);text-align:right;width:100%}
.ta{border:1px solid transparent;background:transparent;width:100%;padding:8px 10px;outline:none;font-family:var(--font);color:var(--gray5);font-size:15px;line-height:1.7;resize:none;overflow:hidden;border-left:3px solid transparent;border-radius:0 var(--radius-sm) var(--radius-sm) 0;transition:border-color .18s ease,background .18s ease,color .18s ease}
.ta:focus{border-color:rgba(35,94,157,.25);border-left-color:var(--blue);background:#fff}
.ta:hover:not(:focus){background:rgba(236,231,220,.36)}
.ta.lw{color:#8f887c;font-style:italic;border-left-color:var(--line)}
.ta.lw:focus{border-left-color:var(--gray3);background:#fff;color:var(--gray5);font-style:normal}
.progress-items{display:grid;gap:7px;margin-top:6px}
.progress-item-row{display:grid;grid-template-columns:20px minmax(0,1fr) 30px;gap:6px;align-items:start;padding:5px 6px;background:rgba(236,231,220,.34);border:1px solid transparent;border-radius:var(--radius-sm)}
.progress-item-row:focus-within{border-color:rgba(35,94,157,.22);background:#fff}
.progress-item-index{display:flex;align-items:center;justify-content:center;width:20px;height:20px;margin-top:7px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:11px;font-weight:760}
.progress-item{padding-inline:4px;border-left:0}.progress-item:focus{border-left-color:transparent}
.progress-item-remove{width:28px;height:28px;margin-top:2px;border:0;background:transparent;color:var(--gray3);cursor:pointer;border-radius:var(--radius-sm);font-size:16px}
.progress-item-remove:hover{background:rgba(164,64,54,.08);color:var(--red)}
.progress-add{margin-top:7px;border:0;background:transparent;color:var(--blue);font:700 12px var(--font);cursor:pointer;padding:4px 0}.progress-add:hover{text-decoration:underline}

/* kr list */
.kl{margin-left:0;padding:0 16px 16px}
.kr{border-top:1px solid var(--line);padding:18px 0;display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:18px;align-items:start;position:relative;transition:background .15s;border-radius:0}
.kr:hover{background:rgba(255,255,255,.48)}
.kr:hover .kg{opacity:.4}.kr:hover .km{opacity:1}
.kg{opacity:.22;cursor:grab;font-size:12px;color:var(--gray4);user-select:none;transition:opacity .2s,color .2s;position:absolute;left:-12px;top:20px}
.kg:hover{color:var(--gray5)}.kg:active{cursor:grabbing}
.km{opacity:0;transition:all .2s;position:absolute;right:-8px;top:18px}
.km button{border:none;background:none;cursor:pointer;font-size:15px;color:var(--gray3);padding:2px 6px;border-radius:var(--radius-sm);transition:all .15s}
.km button:hover{color:var(--red);background:rgba(255,59,48,.08)}
.kh{display:flex;align-items:center;gap:10px}
.pl{font-size:12px;color:var(--muted);margin-top:10px;font-weight:760}

/* progress */
.pc{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.pp{display:flex;align-items:center}
.pb{width:28px;height:28px;border:1px solid var(--line);background:var(--panel);font-size:14px;cursor:pointer;color:var(--gray4);display:flex;align-items:center;justify-content:center;font-family:var(--font);transition:all .15s;padding:0}
.pb:hover{border-color:#c8c0b2;color:var(--fg);background:var(--soft)}
.pb:active{background:var(--gray2)}
.pv{font-size:23px;font-weight:780;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.pu{font-size:11px;color:var(--gray3);margin-left:2px}
.br{width:100%;height:8px;background:#e5e0d5;position:relative;border-radius:999px;overflow:hidden}
.bf{height:100%;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s;border-radius:inherit}
.bp{position:absolute;top:0;height:100%;border-right:2px dashed var(--gray3)}
.dt{font-size:11px;font-weight:600}.dt.u{color:var(--green)}.dt.d{color:var(--red)}.dt.z{color:var(--gray3)}

/* buttons */
.ab{font-size:12px;padding:7px 14px;border:1px solid var(--line);background:var(--panel);color:var(--gray5);cursor:pointer;transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;font-family:var(--font);border-radius:var(--radius-sm);box-shadow:0 8px 18px rgba(34,33,28,.04)}
.ab:hover{border-color:#c8c0b2;color:var(--fg);background:var(--soft);transform:translateY(-1px)}
.ab:active{transform:translateY(0)}
.ab.off{opacity:.35;pointer-events:none}
.dv{border:none;margin:16px 0}

/* drawer */
.do{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:1000;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.dr{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;background:var(--panel);z-index:1001;box-shadow:-18px 0 48px rgba(34,33,28,.18);overflow-y:auto;padding:32px 28px;border-left:1px solid var(--line)}
.dr h2{font-size:17px;font-weight:700;margin-bottom:24px;letter-spacing:-.01em}
.dc{position:absolute;top:16px;right:20px;font-size:22px;cursor:pointer;background:none;border:none;color:var(--gray4);width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .15s}
.dc:hover{background:var(--soft);color:var(--fg)}
.hw{border-top:1px solid var(--line);padding:16px 0}
.hd{font-size:12px;font-weight:600;color:var(--gray4)}
.hp{font-size:15px;font-weight:700}
.ht{font-size:13px;color:var(--gray5);margin-top:6px;line-height:1.6}
.hs{font-size:11px;color:var(--gray4)}
.hl{font-size:11px;color:var(--gray4);cursor:pointer;border:none;background:none;font-family:var(--font);padding:2px 0;margin-top:4px;transition:color .15s}
.hl:hover{color:var(--blue)}

/* drag */
.dragging{opacity:.3}
.drag-over{box-shadow:inset 0 3px 0 var(--blue);background:rgba(35,94,157,.06)}

.ft{font-size:11px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--line);line-height:1.7}
.err{padding:42px 26px;color:var(--red);font-size:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.loading{text-align:center;margin-top:28px;padding:48px 20px;color:var(--muted);font-size:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(35,94,157,.35);outline-offset:2px}

.present-shell{min-height:calc(100vh - 41px);width:100%;padding:28px 34px 34px;background:linear-gradient(180deg,#fffdf8 0,var(--bg) 320px)}
.present-stage{min-height:calc(100vh - 103px);display:grid;grid-template-rows:auto 1fr auto;gap:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:26px}
.present-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.present-title{display:flex;align-items:flex-start;gap:14px}
.present-title h1{font-size:clamp(28px,4vw,58px);line-height:1.08}
.present-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.present-body{display:grid;grid-template-columns:1fr 230px;gap:24px;align-content:start}
.present-list{display:grid;gap:14px}
.present-card{padding:15px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.present-card h2{margin:0 0 8px;font-size:clamp(20px,2vw,30px);line-height:1.25}
.present-card p{margin:0;color:var(--gray5);font-size:clamp(16px,1.35vw,21px);line-height:1.65}
.present-card .present-owner{margin-bottom:8px;color:var(--muted);font-size:14px;font-weight:700}
.present-progress{display:grid;gap:16px;align-content:start;padding:18px;background:var(--soft);border:1px solid var(--line)}
.present-progress b{font-size:clamp(42px,5vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.present-bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.present-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.present-actions .ab{background:#fff}
.mode-badge{display:inline-flex;align-items:center;width:fit-content;padding:5px 9px;color:#fff;background:var(--orange);border-radius:var(--radius-sm);font-size:12px;font-weight:760}
.fill-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-md);background:#f6fbf9;color:var(--gray5);font-size:12px}
.fill-summary strong{color:var(--green);font-size:14px}
.fill-summary.needs-attention{border-color:#e2c68f;background:#fff9ed}
.fill-summary.needs-attention strong{color:#9a650f}
.ta:placeholder-shown{border-color:#d8b66e;background:#fffaf0}

@media(max-width:900px){
  .app{width:min(100% - 32px,720px);padding:24px 0 36px}
  header{align-items:flex-start}
  .hr{width:100%;justify-content:flex-start;flex-wrap:wrap}
  .wn{width:100%;justify-content:flex-start}
  .wl{min-width:0;flex:1}
  .oh{align-items:flex-start;flex-wrap:wrap}
  .oa{margin-left:0}
  .kr{grid-template-columns:1fr;gap:12px}
  .kh{align-items:flex-start;flex-direction:column}
  .ei.ow{max-width:none}
  .pc{align-items:stretch}
  .pp{justify-content:flex-start}
  .ei.st{text-align:left}
  .km{right:0}
  .dr{width:100vw;max-width:100vw}
  .present-shell{padding:16px}
  .present-stage{min-height:calc(100vh - 73px);padding:18px}
  .present-top,.present-bottom{align-items:flex-start;flex-direction:column}
  .present-body{grid-template-columns:1fr}
  .present-meta,.present-actions{justify-content:flex-start}
  .oh .og,.kr .kg{display:none}
  .fill-summary{align-items:flex-start;flex-direction:column}
}
</style>
</head>

<script>

var db = null;
var FIREBASE_DATABASE_URL = firebaseConfig.databaseURL;
var LOCAL_VIEW = null;
var TRACKER_STATE_API = '/api/tracker-state';
var TRACKER_STATE = null;
var TRACKER_STATE_UPDATED_AT = '';
var TRACKER_SAVE_QUEUE = Promise.resolve();

function showFirebaseLoadError(){
  document.getElementById('root').innerHTML =
    '<div class="app err">' +

    '<h2 style="font-size:22px;margin-bottom:12px">选择查看方式</h2>' +

    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">' +

async function loadLocalSnapshot(){
  document.getElementById('root').innerHTML='<div class="app loading">正在加载本地数据...</div>';
  try{
    var data=await loadSnapshotData();
    renderLocalSnapshot(data);
    return;
  }catch(e2){
    document.getElementById('root').innerHTML='<div class="app err">本地数据加载失败<br><br>'+esc(e2.message)+'<br><br><p style="color:var(--gray4);font-size:13px;line-height:1.6;max-width:600px">请确保 data/current-okr.js 文件存在。<br>如果通过 HTTP 服务访问，也可以使用 data/current-okr.json。</p><div style="margin-top:16px"><button class="ab" onclick="showTrackerGateway()">返回</button></div></div>';
  }
}

async function loadSnapshotData(){
  // Method 1: fetch (works over HTTP)
  try{
    var resp=await fetch('./data/current-okr.json');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    return await resp.json();
  }catch(e){}
  // Method 2: check if already loaded via script tag
  if(window.OKR_LOCAL_DATA)return window.OKR_LOCAL_DATA;
  // Method 3: load as script (works over file://)
  await loadScript('./data/current-okr.js');
  if(window.OKR_LOCAL_DATA)return window.OKR_LOCAL_DATA;
  throw new Error('数据变量未定义');
}

function trackerStateFromSnapshot(data){
  var weekLabels=(data.coverage&&data.coverage.weeks?data.coverage.weeks:[]).slice();
  var weekList=weekLabels.map(function(label){
    var match=String(label).match(/\((\d{4}-\d{2}-\d{2})\)/);
    return match?match[1]:String(label).split(' ')[0];
  });
  var weeks={};
  weekList.forEach(function(mon,wi){
    var label=weekLabels[wi]||mon;
    var weekCode=String(label).split(' ')[0];
    var rows=(data.rows||[]).filter(function(row){return row.date===mon||row.week===weekCode});
    var projectMap={};var projectOrder=[];
    weeks[mon]={struct:[],krs:{}};
    rows.forEach(function(row){
      var projectId=row.projectId||('P'+(projectOrder.length+1));
      if(!projectMap[projectId]){
        projectMap[projectId]={id:'obj-'+projectId,title:row.projectTitle||projectId,krIds:[]};
        projectOrder.push(projectId);
      }
      var kid=projectId.toLowerCase()+'-'+String(projectMap[projectId].krIds.length+1).padStart(2,'0');
      projectMap[projectId].krIds.push(kid);
      weeks[mon].krs[kid]={
        id:kid,
        title:row.task||'周报更新',
        owner:row.owner||'',
        pct:Math.max(0,Math.min(100,Number(row.progress)||0)),
        status:row.status||'',
        thisWeek:row.thisWeek||row.progressText||'',
        lastWeek:row.lastWeek||''
      };
    });
    weeks[mon].struct=projectOrder.map(function(projectId){return projectMap[projectId]});
  });
  return {meta:{weekList:weekList},weeks:weeks};
}

async function ensureSitesState(){
  if(TRACKER_STATE)return TRACKER_STATE;
  try{
    var resp=await fetch(TRACKER_STATE_API,{headers:{'accept':'application/json'}});
    if(resp.ok){
      var payload=await resp.json();
      if(payload&&payload.state&&payload.state.meta&&payload.state.weeks){
        TRACKER_STATE=payload.state;
        TRACKER_STATE_UPDATED_AT=payload.updatedAt||'';
        return TRACKER_STATE;
      }
    }
  }catch(e){}
  TRACKER_STATE=trackerStateFromSnapshot(await loadSnapshotData());
  return TRACKER_STATE;
}

async function persistSitesState(){
  var body=JSON.stringify({state:TRACKER_STATE});
  TRACKER_SAVE_QUEUE=TRACKER_SAVE_QUEUE.catch(function(){}).then(async function(){
    var resp=await fetch(TRACKER_STATE_API,{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:body
    });
    if(!resp.ok){
      var text=await resp.text();
      throw new Error(text||('HTTP '+resp.status));
    }
  });
  return TRACKER_SAVE_QUEUE;
}

async function patchSitesState(patch){
  var body=JSON.stringify({patch:patch});
  TRACKER_PATCH_QUEUE=TRACKER_PATCH_QUEUE.catch(function(){}).then(async function(){
    var resp=await fetch(TRACKER_STATE_API,{
      method:'PATCH',
      headers:{'content-type':'application/json'},
      body:body
    });
    if(!resp.ok){
      var text=await resp.text();
      throw new Error(text||('HTTP '+resp.status));
    }
  });
  return TRACKER_PATCH_QUEUE;
}

async function sitesGet(path){
  var state=await ensureSitesState();
  if(path==='okr/meta')return state.meta;
  if(path.indexOf('okr/weeks/')===0)return state.weeks[path.slice('okr/weeks/'.length)]||null;
  return null;
}

async function sitesSet(path,val){
  var state=await ensureSitesState();
  if(path==='okr/meta')state.meta=val;
  else if(path.indexOf('okr/weeks/')===0)state.weeks[path.slice('okr/weeks/'.length)]=val;
  else throw new Error('未知保存路径：'+path);
  await persistSitesState();
}

async function sitesPatch(patch){
  await ensureSitesState();
  if(patch.op==='krField'&&TRACKER_STATE.weeks[patch.week]&&TRACKER_STATE.weeks[patch.week].krs&&TRACKER_STATE.weeks[patch.week].krs[patch.kid]){
    TRACKER_STATE.weeks[patch.week].krs[patch.kid][patch.field]=patch.value;
  }else if(patch.op==='objectiveTitle'&&TRACKER_STATE.weeks[patch.week]&&TRACKER_STATE.weeks[patch.week].struct&&TRACKER_STATE.weeks[patch.week].struct[patch.objectiveIndex]){
    TRACKER_STATE.weeks[patch.week].struct[patch.objectiveIndex].title=patch.value;
  }else if(patch.op==='week'){
    TRACKER_STATE.weeks[patch.week]=patch.weekState;
  }else if(patch.op==='rollWeek'){
    var source=TRACKER_STATE.weeks[patch.fromWeek];
    if(source){
      var copy=JSON.parse(JSON.stringify(source));
      Object.keys(copy.krs||{}).forEach(function(kid){
        copy.krs[kid].lastWeek=copy.krs[kid].thisWeek||'';
        copy.krs[kid].thisWeek='';
      });
      TRACKER_STATE.weeks[patch.toWeek]=copy;
      if(TRACKER_STATE.meta.weekList.indexOf(patch.toWeek)===-1)TRACKER_STATE.meta.weekList=sortWeekList(TRACKER_STATE.meta.weekList.concat([patch.toWeek]));
    }
  }
  await patchSitesState(patch);
}

function localPresentStep(d){

function loadScript(src){
  return new Promise(function(resolve,reject){
    var s=document.createElement('script');
    var done=false;
    var timer=setTimeout(function(){
      if(done)return;
      done=true;
      s.remove();
      reject(new Error('加载超时：'+src));
    },5000);
    s.onload=function(){
      if(done)return;
      done=true;
      clearTimeout(timer);
      resolve();
    };
    s.onerror=function(){
      if(done)return;
      done=true;
      clearTimeout(timer);
      reject(new Error('加载失败：'+src));
    };
    s.src=src;
    document.head.appendChild(s);
  });
}

function firebaseRestUrl(path){return FIREBASE_DATABASE_URL+'/'+String(path||'').replace(/^\/+|\/+$/g,'')+'.json'}
async function firebaseRest(path,method,value){var options={method:method||'GET',headers:{'accept':'application/json'}};if(value!==undefined){options.headers['content-type']='application/json';options.body=JSON.stringify(value)}var resp=await fetch(firebaseRestUrl(path),options);if(!resp.ok)throw new Error('Firebase HTTP '+resp.status);return method==='GET'||!method?await resp.json():true}

function mondayOf(d){var t=new Date(d);t.setDate(t.getDate()-((t.getDay()+6)%7));t.setHours(0,0,0,0);return t}
function wkLabel(mon){var m=new Date(mon),j=new Date(m.getFullYear(),0,1),w=Math.ceil(((m-j)/864e5+j.getDay())/7);return 'W'+w+' ('+fmt(m)+')'}
function thisMon(){return fmt(mondayOf(new Date()))}
function weekTime(mon){var t=Date.parse(mon);return Number.isFinite(t)?t:0}
function sortWeekList(wl){return fixArr(wl).filter(Boolean).sort(function(a,b){return weekTime(a)-weekTime(b)})}
function latestWeekIndex(wl){return Math.max(0,wl.length-1)}

// Firebase array fix
function fixArr(v){
  if(!v)return[];if(Array.isArray(v))return v;
  if(typeof v==='object'){var ks=Object.keys(v);if(ks.every(function(k){return!isNaN(k)}))return ks.sort(function(a,b){return+a-+b}).map(function(k){return v[k]})}
  return[v];
}
function fixWeekData(wd){
  if(!wd)return null;wd.struct=fixArr(wd.struct);
  wd.struct.forEach(function(obj){obj.krIds=fixArr(obj.krIds)});
  if(!wd.krs)wd.krs={};return wd;
}

function fbGet(path){if(!db)return sitesGet(path);return firebaseRest(path,'GET').catch(function(){db=null;return sitesGet(path)})}
function fbSet(path,val){return db?firebaseRest(path,'PUT',val):sitesSet(path,val)}
function firebasePatch(patch){
  if(patch.op==='krField')return firebaseRest('okr/weeks/'+patch.week+'/krs/'+patch.kid+'/'+patch.field,'PUT',patch.value);
  if(patch.op==='objectiveTitle')return firebaseRest('okr/weeks/'+patch.week+'/struct/'+patch.objectiveIndex+'/title','PUT',patch.value);
  if(patch.op==='week')return firebaseRest('okr/weeks/'+patch.week,'PUT',patch.weekState);
  if(patch.op==='rollWeek')return firebaseRest('okr/weeks/'+patch.fromWeek,'GET').then(function(raw){
    var source=fixWeekData(raw);
    if(!source)throw new Error('找不到可继承的上一周周报。');
    var copy=JSON.parse(JSON.stringify(source));
    Object.keys(copy.krs||{}).forEach(function(kid){copy.krs[kid].lastWeek=copy.krs[kid].thisWeek||'';copy.krs[kid].thisWeek=''});
    return firebaseRest('','PATCH',{
      ['okr/weeks/'+patch.toWeek]:copy
    }).then(function(){return firebaseRest('okr/meta/weekList','GET')}).then(function(w){
      var list=sortWeekList(fixArr(w).concat([patch.toWeek]).filter(function(x,i,a){return a.indexOf(x)===i}));
      return firebaseRest('okr/meta/weekList','PUT',list);
    });
  });
  throw new Error('未知保存补丁。');
}

// ── init ──
async function init(){
  S.loading=true;S.drawer=null;render();
  try{
    var m=await fbGet('okr/meta');
    if(!m){var seed=makeSeed();m=seed.meta;await fbSet('okr/meta',m);await fbSet('okr/weeks/2026-03-09',seed.w1);await fbSet('okr/weeks/2026-03-16',seed.w2)}
    m.weekList=sortWeekList(m.weekList);
    var mon=thisMon();
    if(m.weekList.indexOf(mon)===-1){
      var lastMon=m.weekList[m.weekList.length-1];
      var lastWd=fixWeekData(await fbGet('okr/weeks/'+lastMon));
      if(lastWd){var nk={};for(var id in lastWd.krs){nk[id]=Object.assign({},lastWd.krs[id],{lastWeek:lastWd.krs[id].thisWeek||'',thisWeek:''})}
        if(db){
          await fbSet('okr/weeks/'+mon,{struct:JSON.parse(JSON.stringify(lastWd.struct)),krs:nk});m.weekList.push(mon);await fbSet('okr/meta',m)
        }else{
          await sitesPatch({op:'rollWeek',fromWeek:lastMon,toWeek:mon});m.weekList=sortWeekList(m.weekList.concat([mon]))
        }
      }
    }
    S.meta=m;S.wi=latestWeekIndex(m.weekList);await loadWeek(m.weekList,S.wi);S.loading=false;render();
  }catch(e){document.getElementById('root').innerHTML='<div class="app err">加载失败，请刷新重试或先查看本地快照。<br><br>'+esc(e.message)+'<div style="margin-top:16px"><button class="ab" onclick="init()">重试保存版</button><button class="ab" onclick="loadLocalSnapshot()">本地快照</button></div></div>'}
}
async function loadWeek(wl,idx){
  var wd=fixWeekData(await fbGet('okr/weeks/'+wl[idx]));S.wd=wd;
  if(idx>0){var pwd=fixWeekData(await fbGet('okr/weeks/'+wl[idx-1]));S.prev=pwd?pwd.krs:{}}else{S.prev={}}
}

function saveDot(st){
  S.ss=st;var d=document.querySelector('.sd');var t=document.querySelector('.ss-text');
  if(d)d.className='sd '+st;if(t)t.textContent=st==='saving'?'\u4fdd\u5b58\u4e2d...':st==='saved'?'\u2713 \u5df2\u4fdd\u5b58':st==='failed'?'\u4fdd\u5b58\u5931\u8d25':''
}
function saveWeek(){
  var mon=S.meta.weekList[S.wi];saveDot('saving');
  deb('save',function(){fbSet('okr/weeks/'+mon,S.wd).then(function(){saveDot('saved');setTimeout(function(){saveDot('idle')},1000)}).catch(function(e){console.error(e);saveDot('failed')})});
}
function savePatch(key,patch){
  saveDot('saving');
  deb('save-'+key,function(){(db?firebasePatch(patch):sitesPatch(patch)).then(function(){saveDot('saved');setTimeout(function(){saveDot('idle')},4000)}).catch(function(e){console.error(e);saveDot('failed')})},600);
}
function saveWeekPatch(){
  var mon=S.meta.weekList[S.wi];
  saveDot('saving');
  deb('save-week-'+mon,function(){(db?firebasePatch({op:'week',week:mon,weekState:S.wd}):sitesPatch({op:'week',week:mon,weekState:S.wd})).then(function(){saveDot('saved');setTimeout(function(){saveDot('idle')},4000)}).catch(function(e){console.error(e);saveDot('failed')})},600);
}

// ── actions (text edits: no render; structural changes: render) ──
function sw(idx){if(!S.meta||idx<0||idx>=S.meta.weekList.length)return;S.wi=idx;S.loading=true;render();loadWeek(S.meta.weekList,idx).then(function(){S.loading=false;render()})}
function ukr(kid,f,v){S.wd.krs[kid][f]=v;savePatch(S.meta.weekList[S.wi]+'-'+kid+'-'+f,{op:'krField',week:S.meta.weekList[S.wi],kid:kid,field:f,value:v})}
function updateProgressItem(kid,idx,value){var items=progressItems(S.wd.krs[kid].thisWeek);items[idx]=value;ukr(kid,'thisWeek',items.join('\n'))}
function addProgressItem(kid,after){var items=progressItems(S.wd.krs[kid].thisWeek);items.splice(after+1,0,'');S.wd.krs[kid].thisWeek=items.join('\n');savePatch(S.meta.weekList[S.wi]+'-'+kid+'-thisWeek',{op:'krField',week:S.meta.weekList[S.wi],kid:kid,field:'thisWeek',value:S.wd.krs[kid].thisWeek});render();setTimeout(function(){var el=document.querySelector('[data-progress-item="'+kid+'-'+(after+1)+'"]');if(el){el.focus();ah(el)}},0)}
function removeProgressItem(kid,idx){var items=progressItems(S.wd.krs[kid].thisWeek);if(items.length===1)items[0]='';else items.splice(idx,1);S.wd.krs[kid].thisWeek=items.join('\n');savePatch(S.meta.weekList[S.wi]+'-'+kid+'-thisWeek',{op:'krField',week:S.meta.weekList[S.wi],kid:kid,field:'thisWeek',value:S.wd.krs[kid].thisWeek});render()}
function upct(kid,d){var kr=S.wd.krs[kid];kr.pct=Math.max(0,Math.min(100,kr.pct+d));savePatch(S.meta.weekList[S.wi]+'-'+kid+'-pct',{op:'krField',week:S.meta.weekList[S.wi],kid:kid,field:'pct',value:kr.pct});render()}
function uot(oi,v){S.wd.struct[oi].title=v;savePatch(S.meta.weekList[S.wi]+'-objective-'+oi,{op:'objectiveTitle',week:S.meta.weekList[S.wi],objectiveIndex:oi,value:v})}
function aobj(){var kid=uid();S.wd.krs[kid]={id:kid,title:'',owner:'',pct:0,status:'',thisWeek:'',lastWeek:''};S.wd.struct.push({id:uid(),title:'',krIds:[kid]});saveWeekPatch();render()}
function robj(oi){if(S.wd.struct.length<=1)return;S.wd.struct.splice(oi,1);saveWeekPatch();render()}
function akr(oi){var kid=uid();S.wd.krs[kid]={id:kid,title:'',owner:'',pct:0,status:'',thisWeek:'',lastWeek:''};S.wd.struct[oi].krIds.push(kid);saveWeekPatch();render()}
function rkr(oi,kid){var o=S.wd.struct[oi];if(!o||o.krIds.length<=1)return;o.krIds=o.krIds.filter(function(k){return k!==kid});saveWeekPatch();render()}

// ── drag: ONLY grip handle is draggable, not the whole row ──
var DT='',DI=-1,dragEl=null;
function ds(e,t,i){
  DT=t;DI=i;dragEl=e.target.closest('.oh,.kr');
  e.dataTransfer.effectAllowed='move';
  if(dragEl)dragEl.classList.add('dragging');
}
function de(e){if(dragEl){dragEl.classList.remove('dragging');dragEl=null}}
function dov(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function dl(e){e.currentTarget.classList.remove('drag-over')}
function ddrop(e,t,i,oi){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(t!==DT||DI===i)return;
  if(t==='obj'){S.wd.struct=moveItem(S.wd.struct,DI,i)}
  else if(t==='kr'&&oi!==undefined){S.wd.struct[oi].krIds=moveItem(S.wd.struct[oi].krIds,DI,i)}
  saveWeekPatch();render();
}

// ── history ──
async function openHist(kid,title){
  S.drawer={title:title,items:null};render();var items=[];
  for(var i=S.meta.weekList.length-1;i>=0;i--){var mon=S.meta.weekList[i];var wd=fixWeekData(await fbGet('okr/weeks/'+mon));if(wd&&wd.krs&&wd.krs[kid]){var k=wd.krs[kid];items.push({label:wkLabel(mon),pct:k.pct,status:k.status,tw:k.thisWeek})}}
  S.drawer.items=items;render();
}
function closeHist(){S.drawer=null;render()}

function startPresent(){
  if(!S.wd||!S.wd.struct||!S.wd.struct.length)return;
  S.present=true;S.pidx=0;S.drawer=null;render();enterFullscreen();
}

function exitPresent(){
  S.present=false;render();
}

function presentStep(d){
  if(!S.present||!S.wd||!S.wd.struct)return;
  S.pidx=Math.max(0,Math.min(S.wd.struct.length-1,S.pidx+d));
  render();
}

function enterFullscreen(){
  var el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen().catch(function(){});
}

function presentShell(cfg, stepFn, exitFn){
  var h='<div class="present-shell"><section class="present-stage">';
  h+='<div class="present-top"><div class="present-title"><span class="on">'+String(cfg.idx+1).padStart(2,'0')+'</span><h1>'+esc(cfg.title)+'</h1></div>';
  h+='<div class="present-meta">'+(cfg.readonly?'<span class="mode-badge">只读快照</span>':'')+'<span class="ws">'+esc(cfg.label)+'</span><span class="oa">'+cfg.avg+'%</span></div></div>';
  h+='<div class="present-body"><div class="present-list">';
  cfg.items.forEach(function(x){
    h+='<article class="present-card"><h2>'+esc(x.title)+'</h2>';
    if(x.owner||x.status)h+='<div class="present-owner">'+esc([x.owner,x.status].filter(Boolean).join(' · '))+'</div>';
    if(x.tw)h+='<p>'+esc(x.tw)+'</p>';
    if(x.lw)h+='<p style="margin-top:8px;color:#8f887c;font-style:italic">'+esc(x.lw)+'</p>';
    h+='</article>';
  });
  h+='</div><aside class="present-progress"><span>'+esc(cfg.label)+'</span><b>'+cfg.avg+'%</b><div class="br"><div class="bf" style="width:'+cfg.avg+'%"></div></div><span>第 '+(cfg.idx+1)+' / '+cfg.total+' 个大项目</span></aside></div>';
  h+='<div class="present-bottom"><span>左右方向键切换 · Esc 退出 · 适合投屏逐页汇报</span><div class="present-actions">';
  h+='<button class="ab '+(cfg.idx<=0?'off':'')+'" onclick="'+stepFn+'(-1)">上一页</button>';
  h+='<button class="ab '+(cfg.idx>=cfg.total-1?'off':'')+'" onclick="'+stepFn+'(1)">下一页</button>';
  h+='<button class="ab" onclick="'+exitFn+'()">退出播放</button></div></div>';
  h+='</section></div>';
  return h;
}

document.addEventListener('keydown',function(e){
  if(S.present){
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();presentStep(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();presentStep(-1)}
    else if(e.key==='Escape'){e.preventDefault();exitPresent()}
    return;
  }
  if(LOCAL_VIEW&&document.querySelector('.present-shell')){
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();localPresentStep(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();localPresentStep(-1)}
    else if(e.key==='Escape'){e.preventDefault();loadLocalSnapshot()}
  }
})

// ── render ──
function render(){

    avg=krIds.length?Math.round(avg/krIds.length):0;

  h+='<button onclick="startPresent()">\u6295\u5c4f\u64ad\u653e</button><button onclick="loadLocalSnapshot()">\u672c\u5730\u5feb\u7167</button><button onclick="init()">\u5237\u65b0</button></div></header>';
  h+='<div class="wn"><button class="ar '+(wi<=0?'off':'')+'" onclick="sw('+(wi-1)+')">\u2039</button>';
  h+='<div class="wl">'+wkLabel(curMon)+(isLast?'<span class="ws">\u5f53\u524d</span>':'')+'</div>';

  h+='<span style="font-size:12px;color:var(--gray3);margin:0 12px">|</span><span style="font-size:12px;color:var(--gray4)">'+m.weekList.length+' \u5468</span></div>';

  var totalTasks=0,activeTasks=0,pausedTasks=0,filledTasks=0;
  struct.forEach(function(obj){(obj.krIds||[]).forEach(function(kid){var task=krs[kid];if(task){totalTasks++;if(isPausedTask(task,obj)){pausedTasks++}else{activeTasks++;if(String(task.thisWeek||'').trim())filledTasks++}}})});
  var missingTasks=Math.max(0,activeTasks-filledTasks);
  h+='<div class="fill-summary '+(missingTasks?'needs-attention':'')+'"><strong>\u672c\u5468\u8fdb\u5c55 '+filledTasks+'/'+activeTasks+' \u5df2\u586b\u5199</strong><span>'+(missingTasks?'\u8fd8\u6709 '+missingTasks+' \u9879\u5f85\u8865\u5145':'\u672c\u5468\u8fdb\u5c55\u5df2\u9f50\u5168')+(pausedTasks?' \u00b7 '+pausedTasks+' \u9879\u6302\u8d77\u4e0d\u8ba1\u5165':'')+'</span></div>';

  struct.forEach(function(obj,oi){
    var avg=0,krIds=obj.krIds||[];

      var itemList=progressItems(kr.thisWeek);h+='<div class="pl">\u672c\u5468\u8fdb\u5c55 \u00b7 \u6bcf\u6761\u72ec\u7acb\u8bb0\u5f55</div><div class="progress-items">';itemList.forEach(function(item,itemIndex){h+='<div class="progress-item-row"><span class="progress-item-index">'+(itemIndex+1)+'</span><textarea class="ta progress-item" data-progress-item="'+kid+'-'+itemIndex+'" placeholder="\u8bb0\u5f55\u4e00\u6761\u5177\u4f53\u8fdb\u5c55" oninput="updateProgressItem(\''+kid+'\','+itemIndex+',this.value);ah(this)" onfocus="ah(this)" rows="1">'+esc(item)+'</textarea><button class="progress-item-remove" onclick="removeProgressItem(\''+kid+'\','+itemIndex+')" title="\u5220\u9664\u8fd9\u6761\u8fdb\u5c55">\u00d7</button></div>'});h+='</div><button class="progress-add" onclick="addProgressItem(\''+kid+'\','+(itemList.length-1)+')">+ \u6dfb\u52a0\u4e00\u6761\u8fdb\u5c55</button>';

    if(oi<struct.length-1)h+='<hr class="dv">';
  });

  h+='<button class="ab" style="margin-left:80px" onclick="aobj()">+ \u6dfb\u52a0\u91cd\u70b9\u5de5\u4f5c</button>';
  h+='<div class="ft">\u62d6\u62fd \u2261 \u8c03\u6574\u987a\u5e8f \u00b7 \u70b9\u51fb\u7f16\u8f91 \u00b7 Enter \u5b8c\u6210 \u00b7 \u00b1 \u8c03\u8fdb\u5ea6 \u00b7 \u2039\u203a \u5207\u6362\u5468 \u00b7 \u6bcf\u5468\u4e00\u81ea\u52a8\u65b0\u7248\u672c \u00b7 \u6570\u636e\u81ea\u52a8\u4fdd\u5b58</div></div>';

  if(S.drawer){
    h+='<div class="do" onclick="closeHist()"></div><div class="dr"><button class="dc" onclick="closeHist()">\u00d7</button><h2>'+esc(S.drawer.title)+'</h2>';
    if(S.drawer.items){
      if(!S.drawer.items.length)h+='<div style="color:var(--gray4);font-size:13px">\u6682\u65e0\u5386\u53f2</div>';
      S.drawer.items.forEach(function(x){h+='<div class="hw"><div style="display:flex;justify-content:space-between"><span class="hd">'+x.label+'</span><span class="hp">'+x.pct+'%</span></div><div class="hs">'+esc(x.status||'')+'</div>';if(x.tw)h+='<div class="ht">'+esc(x.tw)+'</div>';h+='</div>'});
    }else{h+='<div style="color:var(--gray4);font-size:13px">Loading...</div>'}
    h+='</div>';
  }
  root.innerHTML=h;
  root.querySelectorAll('textarea').forEach(function(el){ah(el)});
}

function bootTracker(){
  connectFirebase();
}

bootTracker();
</script>
